<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="success-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Filters for Glow & Shadows -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    /* Animated Dynamic Floating Elements */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1.5deg); }
    }

    @keyframes floatMedium {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-16px) rotate(-2deg); }
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.08); }
    }

    @keyframes dataFlow {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes badgeBounce {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .anim-float-1 {
      animation: floatSlow 7s ease-in-out infinite;
      transform-origin: center;
    }

    .anim-float-2 {
      animation: floatMedium 5.5s ease-in-out infinite;
      transform-origin: center;
    }

    .anim-pulse {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: center;
    }

    .anim-flow {
      stroke-dasharray: 8 8;
      animation: dataFlow 3s linear infinite;
    }

    .anim-bounce {
      animation: badgeBounce 4s ease-in-out infinite;
      transform-origin: center;
    }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }

    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 17px;
      fill: #94a3b8;
    }

    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.5px;
      fill: #a5b4fc;
    }

    .card-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #f1f5f9;
    }

    .card-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      fill: #64748b;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Background Grid Subtle Texture -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="250" y1="0" x2="250" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="550" y1="0" x2="550" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="850" y1="0" x2="850" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="250" x2="1200" y2="250" />
  </g>

  <!-- Dynamic Ambient Glowing Orbs in Background -->
  <circle cx="1020" cy="110" r="140" fill="#6366f1" filter="url(#soft-glow)" class="anim-pulse" />
  <circle cx="860" cy="270" r="110" fill="#ec4899" filter="url(#soft-glow)" class="anim-pulse" />
  <circle cx="180" cy="300" r="90" fill="#06b6d4" opacity="0.18" filter="url(#soft-glow)" />

  <!-- Dynamic Animated Background Data Flow Lines (Behind Content) -->
  <path d="M 720 180 C 800 130, 850 240, 960 180" fill="none" stroke="url(#glow-grad)" stroke-width="2.5" opacity="0.6" class="anim-flow" />
  <path d="M 820 100 C 900 60, 940 140, 1080 110" fill="none" stroke="url(#accent-cyan)" stroke-width="2" opacity="0.4" class="anim-flow" />

  <!-- DYNAMIC RIGHT-HAND SIDE CARDS & FLOATING PILLS (Positioned away from text) -->
  
  <!-- Floating Checkout Card Graphic (Right Side) -->
  <g class="anim-float-1" filter="url(#card-shadow)">
    <!-- Glassmorphic One-Page Checkout Mockup Card -->
    <rect x="800" y="55" width="330" height="250" rx="14" fill="url(#card-grad)" stroke="#374151" stroke-width="1.2" />
    
    <!-- Card Header / Stepper Bar -->
    <rect x="818" y="75" width="70" height="6" rx="3" fill="#6366f1" />
    <rect x="894" y="75" width="70" height="6" rx="3" fill="#8b5cf6" />
    <rect x="970" y="75" width="70" height="6" rx="3" fill="#10b981" />
    <circle cx="1075" cy="78" r="4" fill="#10b981" />

    <!-- Section 1: Customer & Address Mock -->
    <rect x="818" y="100" width="130" height="12" rx="4" fill="#334155" />
    <rect x="818" y="120" width="294" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="826" y="127" width="100" height="10" rx="3" fill="#475569" />

    <!-- Section 2: Express Payment Options Mock -->
    <rect x="818" y="156" width="140" height="12" rx="4" fill="#334155" />
    <g transform="translate(818, 176)">
      <!-- Apple Pay / Shop Pay / Card Pills -->
      <rect x="0" y="0" width="90" height="28" rx="6" fill="#000000" stroke="#374151" stroke-width="1" />
      <text x="45" y="18" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" text-anchor="middle"> Pay</text>
      
      <rect x="98" y="0" width="94" height="28" rx="6" fill="#5a31f4" />
      <text x="145" y="18" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" text-anchor="middle">Shop Pay</text>

      <rect x="200" y="0" width="94" height="28" rx="6" fill="#ffc439" />
      <text x="247" y="18" fill="#003087" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" text-anchor="middle">PayPal</text>
    </g>

    <!-- Complete Order Button (1-Click Action) -->
    <rect x="818" y="222" width="294" height="34" rx="8" fill="url(#success-grad)" />
    <text x="965" y="244" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" text-anchor="middle">✓ Complete Order • 1-Page Flow</text>
  </g>

  <!-- Dynamic Floating Conversion Badge Pill (Top-Right of Card) -->
  <g class="anim-float-2" filter="url(#card-shadow)">
    <g transform="translate(740, 40)">
      <rect width="165" height="36" rx="18" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
      <circle cx="20" cy="18" r="8" fill="#10b981" />
      <path d="M 17 18 L 19 20 L 23 16" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <text x="36" y="22" fill="#e0e7ff" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">+38% Conversion</text>
    </g>
  </g>

  <!-- Dynamic Floating Friction Reduction Pill (Bottom-Right) -->
  <g class="anim-bounce" filter="url(#card-shadow)">
    <g transform="translate(730, 280)">
      <rect width="180" height="34" rx="17" fill="#111827" stroke="#ec4899" stroke-width="1.2" />
      <text x="18" y="21" fill="#f43f5e" font-size="13">⚡</text>
      <text x="36" y="21" fill="#fbcfe8" font-family="-apple-system, sans-serif" font-weight="600" font-size="11.5">Zero Checkout Friction</text>
    </g>
  </g>

  <!-- FOREGROUND BRANDING & TYPOGRAPHY (Clear, High Contrast, Guaranteed Foreground) -->
  <g transform="translate(70, 0)">
    <!-- Category Pill Tag -->
    <g transform="translate(0, 58)">
      <rect width="260" height="28" rx="14" fill="#312e81" fill-opacity="0.65" stroke="#6366f1" stroke-width="1.2" />
      <circle cx="16" cy="14" r="5" fill="#818cf8" />
      <text x="28" y="19" class="tag-text">CURATED CHECKOUT ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="142" class="title-text">Awesome One-Page</text>
    <text x="0" y="194" class="title-text" fill="url(#glow-grad)">Checkout ⚡</text>

    <!-- Subtitle & Descriptive Copy -->
    <text x="0" y="240" class="subtitle-text">High-converting checkout optimization tools, 1-click express payments,</text>
    <text x="0" y="266" class="subtitle-text">and open-source single-page checkout architectures for modern commerce.</text>

    <!-- Metadata Badges Row inside SVG -->
    <g transform="translate(0, 296)">
      <g>
        <rect width="138" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="10" y="16" fill="#94a3b8" font-family="-apple-system, sans-serif" font-weight="500" font-size="11">🚀 Headless &amp; SaaS</text>
      </g>
      <g transform="translate(148, 0)">
        <rect width="144" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="10" y="16" fill="#94a3b8" font-family="-apple-system, sans-serif" font-weight="500" font-size="11">🛒 Frictionless Flows</text>
      </g>
      <g transform="translate(302, 0)">
        <rect width="130" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="10" y="16" fill="#94a3b8" font-family="-apple-system, sans-serif" font-weight="500" font-size="11">🛡️ PCI-DSS Tokenized</text>
      </g>
    </g>
  </g>

  <!-- Subtle Bottom Gradient Border Accent -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#glow-grad)" />
</svg>
